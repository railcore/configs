# RailCore Klipper macros (RailCore II 300ZL/ZLT and RailCore Mini)
# Copy this file next to your printer.cfg; printer.cfg loads it with
# [include macros.cfg].
#
# Slicer start G-code:  PRINT_START BED=[first_layer_bed_temperature] HOTEND=[first_layer_temperature]
#   (PrusaSlicer / SuperSlicer / OrcaSlicer placeholder names; Cura uses
#    BED={material_bed_temperature_layer_0} HOTEND={material_print_temperature_layer_0})
# Slicer end G-code:    PRINT_END
#
# PAUSE, RESUME and CANCEL_PRINT come from mainsail.cfg / fluidd.cfg.
#
# License: MIT (see LICENSE in the root of this repo).

# G32 = home + level, the same name the RRF configs use (bed.g).
[gcode_macro G32]
description: Home, level the bed with Z_TILT_ADJUST, re-home Z
gcode:
    G28
    Z_TILT_ADJUST
    G28 Z

[gcode_macro PRINT_START]
description: Heat, home, level, mesh, purge. Use: PRINT_START BED=60 HOTEND=210
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set hotend = params.HOTEND|default(210)|float %}
    G90
    M83
    SET_GCODE_OFFSET Z=0
    # Heat the bed first: the frame and bed plate move as they warm up,
    # so level after the bed is at temperature.
    M140 S{bed}
    # Warm the nozzle to 150 C so it does not ooze onto the probe points.
    M104 S150
    G28
    M190 S{bed}
    Z_TILT_ADJUST
    G28 Z
    BED_MESH_CLEAR
    # ADAPTIVE=1 needs [exclude_object] and "label objects" in the slicer.
    BED_MESH_CALIBRATE ADAPTIVE=1
    # Park near the front left, heat the nozzle, purge a line along X.
    G1 X5 Y5 Z10 F6000
    M109 S{hotend}
    G1 Z0.3 F600
    G1 X100 E15 F1000
    G1 X120 F6000
    G1 Z2 F600

[gcode_macro PRINT_END]
description: Retract, lift, park the head at the rear, heaters off
gcode:
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set z_now = printer.toolhead.position.z|float %}
    {% set y_max = printer.toolhead.axis_maximum.y|float %}
    {% set z_park = [z_now + 10, z_max]|min %}
    M400
    G91
    G1 E-2 F2400
    G90
    G1 Z{z_park} F600
    G1 X5 Y{y_max - 5} F6000
    TURN_OFF_HEATERS
    M107
    M84

[gcode_macro PROBE_LEADSCREWS]
description: Visit each z_tilt point (nozzle position) so you can see the probe lands on the bed
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% for pt in printer.configfile.settings.z_tilt.points %}
        G1 Z10 F600
        G1 X{pt[0]} Y{pt[1]} F6000
        G4 P2000
    {% endfor %}
