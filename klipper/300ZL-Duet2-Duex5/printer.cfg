# Klipper config: RailCore II 300ZL / 300ZLT, kit electronics
# (Duet 2 WiFi or Ethernet + Duex 5, wired per the RailCore II build guide)
#
# A STARTING POINT, NOT A DROP-IN FILE. Read every section before you power up.
# Every value marked "CHECK:" must be verified on YOUR machine.
# Guide: https://railcore.org/klipper/railcore_config.html
#
# Sources for the values below:
#   - the kit RRF3 config: duet/Duet2 RRF3/sys/config.g in this repo
#   - the RailCore II build guide (railcore.org/guides/), sections J, K, M, P, Q, S
#   - Klipper's config/generic-duet2-duex.cfg (pin numbers)
#   - a working community 300ZL running Klipper on a Duet 2 + Duex 5
#
# Firmware: build Klipper for the SAM4E8E ("make menuconfig": Atmel SAM,
# SAM4e8e, USB) and flash it with bossac (see the guide). The Duet's WiFi or
# Ethernet module is not used: Klipper talks to the host computer over USB.
#
# Kit layout (from the build guide):
#   - X/Y motors on the RIGHT: rear motor = Duet X_Motor, front motor = Duet Y_Motor
#   - X endstop at the rear LEFT (X min), Y endstop on the Y carriage,
#     triggers against the front X carriage (Y min)
#   - three Z motors on the Duex 5: drive 5 front left, drive 6 rear left,
#     drive 7 right
#   - BLTouch: signal on Duet Z_Probe IN, servo wire on Duex 5 PWM1
#   - layer fan on Duet FAN0, hotend fan on an always-on fan header
#   - bed heater through an SSR on the Duet bed heater output,
#     bed thermistor on the Duet bed thermistor input
#
# License: MIT (see LICENSE in the root of this repo).

[include macros.cfg]
# Mainsail or Fluidd: also include the client macros file your installer
# created (mainsail.cfg or fluidd.cfg). It supplies PAUSE, RESUME,
# CANCEL_PRINT, [virtual_sdcard], [pause_resume] and [display_status].
#[include mainsail.cfg]

[mcu]
# Find yours with: ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-Klipper_sam4e8e_CHANGE_ME-if00   # CHECK: your board's id

[sx1509 duex]
# Duex 5 I/O expander. The address is fixed on the Duex boards.
i2c_address: 62

[printer]
kinematics: corexy
# Kit RRF values: M203 X24000 Y24000 Z900 (mm/min), M201 X3000 Y3000 Z100.
# Raise max_accel only after input shaping is tuned.
max_velocity: 400
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5.0

#####################################################################
#   X/Y (CoreXY). In Klipper stepper_x and stepper_y are the two
#   CoreXY motors (A and B), not the axes.
#####################################################################

# Rear motor, Duet X_Motor port
[stepper_x]
step_pin: PD6
dir_pin: PD11            # CHECK: direction. Run the motion test in the guide;
                         # if X and Y both go the wrong way, swap the motor
                         # plugs or add/remove "!" here and on stepper_y.
enable_pin: !PC6
microsteps: 16
rotation_distance: 32    # 16T GT2 pulley (kit M92 X200 at 16x with 0.9 degree motors)
full_steps_per_rotation: 400   # 0.9 degree motors
endstop_pin: ^PC14       # Duet X_Stop
position_endstop: 0
position_min: 0
position_max: 290        # CHECK: kit M208 X290; measure your own travel
homing_speed: 50
second_homing_speed: 10
homing_retract_dist: 5

[tmc2660 stepper_x]
cs_pin: PD14
spi_bus: usart1
interpolate: True
# CHECK: set from your motor's rated current. Klipper's run_current is RMS amps.
# The kit RRF config used M906 X1400 (mA). The kit LDO 42STH47-1684MAC
# is rated 1.68 A; about 70% of rating is a sane start.
run_current: 1.2
sense_resistor: 0.051
idle_current_percent: 25

# Front motor, Duet Y_Motor port
[stepper_y]
step_pin: PD7
dir_pin: !PD12           # CHECK: direction (see stepper_x)
enable_pin: !PC6
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 400
endstop_pin: ^PA2        # Duet Y_Stop
position_endstop: 0
position_min: 0
position_max: 290        # CHECK: kit M208 Y290; measure your own travel
homing_speed: 50
second_homing_speed: 10
homing_retract_dist: 5

[tmc2660 stepper_y]
cs_pin: PC9
spi_bus: usart1
interpolate: True
run_current: 1.2         # CHECK: see stepper_x
sense_resistor: 0.051
idle_current_percent: 25

#####################################################################
#   Z: three independent leadscrews on the Duex 5.
#   Order matters: stepper_z, stepper_z1, stepper_z2 must match the
#   order of z_positions in [z_tilt] below.
#####################################################################

# Duex drive 5 (Klipper "E2" pins): FRONT LEFT
[stepper_z]
step_pin: PD2
dir_pin: !PD28           # CHECK: all three Z motors must move the bed the same way
enable_pin: !PC6
microsteps: 16
rotation_distance: 4     # TR8x4 leadscrew (kit M92 Z1600 at 16x with 0.9 degree motors)
full_steps_per_rotation: 400   # CHECK: 0.9 degree Z motors. TR8x2 + 0.9 = rotation_distance 2.
endstop_pin: probe:z_virtual_endstop
position_min: -2
# CHECK: kit config M208 Z280. The 300ZL is spec'd for 330 mm of Z and the
# 300ZLT for about 600 mm. Measure yours before raising this.
position_max: 280
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 3

[tmc2660 stepper_z]
cs_pin: PD23
spi_bus: usart1
interpolate: True
run_current: 1.0         # CHECK: kit RRF M906 Z1000 (mA); set from your motor rating
sense_resistor: 0.051
idle_current_percent: 25

# Duex drive 6 (Klipper "E3" pins): REAR LEFT
[stepper_z1]
step_pin: PD1
dir_pin: !PD22           # CHECK
enable_pin: !PC6
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 400

[tmc2660 stepper_z1]
cs_pin: PD24
spi_bus: usart1
interpolate: True
run_current: 1.0         # CHECK
sense_resistor: 0.051
idle_current_percent: 25

# Duex drive 7 (Klipper "E4" pins): RIGHT
[stepper_z2]
step_pin: PD0
dir_pin: !PD16           # CHECK
enable_pin: !PC6
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 400

[tmc2660 stepper_z2]
cs_pin: PD25
spi_bus: usart1
interpolate: True
run_current: 1.0         # CHECK
sense_resistor: 0.051
idle_current_percent: 25

#####################################################################
#   Extruder and hotend: kit Bondtech BMG, E3D-style hotend on E0
#####################################################################

[extruder]
step_pin: PD5
dir_pin: PA1             # CHECK: heat the hotend, extrude 10 mm, watch the direction
enable_pin: !PC6
microsteps: 16
# CHECK: kit M92 E837 at 16x with a 0.9 degree motor = 6400 / 837 = 7.646.
# Calibrate: extrude 100 mm, measure, then
# new = old * actual / requested.
rotation_distance: 7.646
full_steps_per_rotation: 400   # CHECK: 0.9 degree extruder motor (kit). 1.8 degree = 200.
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: !PA20        # Duet E0 heater
# CHECK: kit thermistor (RRF T100000 B4725 C7.06e-8) is the E3D Semitec 104GT-2.
# Slice Engineering: "SliceEngineering 450". E3D Revo: "ATC Semitec 104NT-4-R025H42G".
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC15         # Duet E0 temp
# Run PID_CALIBRATE HEATER=extruder TARGET=240, then SAVE_CONFIG.
control: pid
pid_Kp: 22.2             # CHECK: placeholder until PID_CALIBRATE is run
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
# CHECK: kit M143 S285. Never set this above what your hotend,
# thermistor and heater cartridge are rated for.
max_temp: 285
min_extrude_temp: 170
max_extrude_only_distance: 150
pressure_advance: 0.0    # CHECK: tune per filament (Klipper "Pressure Advance" guide)

[tmc2660 extruder]
cs_pin: PC17
spi_bus: usart1
interpolate: True
run_current: 0.6         # CHECK: kit RRF M906 E800 (mA); set from your extruder motor rating
sense_resistor: 0.051
idle_current_percent: 25

# Klipper's heater safety check. Defaults are used on purpose.
# CHECK: if a slow hotend trips "Heater not heating at expected rate",
# find the cause before loosening these.
#[verify_heater extruder]

#####################################################################
#   Bed: Keenovo heater through an SSR, MIC6 plate
#####################################################################

[heater_bed]
heater_pin: !PA19        # Duet bed heater output, drives the SSR
# CHECK: kit bed thermistor (RRF T100000 B3950) in the channel in the bed plate
sensor_type: Generic 3950
sensor_pin: PC13         # Duet bed temp
# Run PID_CALIBRATE HEATER=heater_bed TARGET=100, then SAVE_CONFIG.
control: pid
pid_Kp: 47.4             # CHECK: placeholder until PID_CALIBRATE is run
pid_Ki: 0.654
pid_Kd: 858
min_temp: 0
# CHECK: the kit RRF config does not set a bed limit. 120 C suits PLA/PETG/ABS
# on MIC6. Stay under your heater pad's and adhesive's rating.
max_temp: 120
# The SSR is switched at the default 0.1 s PWM cycle (10 Hz), the same
# order as RRF's bed default. Use a zero-cross SSR for an AC bed.

# The Keenovo pad's own thermistor (kit wires it to the Duex 5 E4 thermistor
# input). Monitoring only.
[temperature_sensor keenovo_pad]
sensor_type: Generic 3950  # CHECK: thermistor type of your Keenovo pad
sensor_pin: PC31           # CHECK: Duex 5 E4 temp input (Klipper duet2-duex table)
min_temp: 0
max_temp: 150

[temperature_sensor mcu]
sensor_type: temperature_mcu

[temperature_sensor host]
sensor_type: temperature_host

#####################################################################
#   Fans
#####################################################################

# Layer fan on Duet FAN0
[fan]
pin: PC23
kick_start_time: 0.3
off_below: 0.10

# The kit wires the hotend fan to an always-on header, so it needs no
# config. If you move it to FAN1, use this instead:
#[heater_fan hotend_fan]
#pin: PC26
#heater: extruder
#heater_temp: 50

#####################################################################
#   Probe: BLTouch
#####################################################################

[bltouch]
sensor_pin: ^PC1         # Duet Z_Probe IN (kit: RRF C"^zprobe.in")
control_pin: !PC3        # CHECK: Duex 5 PWM1 (shares the E2 heater signal, PC3).
                         # The "!" matches a working Duet 2 + Duex 5 setup.
# CHECK: probe offset from the nozzle. Kit RRF G31 X2 Y42; depends on your mount.
x_offset: 2
y_offset: 42
# z_offset: run PROBE_CALIBRATE, then SAVE_CONFIG. Do not guess it.
#z_offset: 0
speed: 5
samples: 2
samples_result: median
sample_retract_dist: 3
samples_tolerance: 0.02
samples_tolerance_retries: 3

# Klipper turns the hotend heater off during each probe so its noise
# does not trigger the BLTouch (RRF M558 B1 does the same thing).
[homing_heaters]
steppers: stepper_z
heaters: extruder

#####################################################################
#   Homing
#####################################################################

# Z homes with the probe. Nozzle at 148,108 puts the probe (offset 2,42)
# at the bed centre.
[safe_z_home]
home_xy_position: 148,108   # CHECK: follows the probe offset above
speed: 150
z_hop: 5
z_hop_speed: 5

#####################################################################
#   Bed leveling: z_tilt (3 leadscrews) + bed mesh
#####################################################################

[z_tilt]
# Leadscrew (pivot) positions in nozzle coordinates, same order as
# stepper_z, stepper_z1, stepper_z2: front left, rear left, right.
# CHECK: kit RRF M671 X-10:-10:333 Y22.5:277.5:150, "measure your own
# offsets, to the bolt for the yoke of each leadscrew". A working
# community 300ZL measured -11,20 / -11,274 / 347,148.
z_positions:
    -10, 22.5
    -10, 277.5
    333, 150
# Probe points in NOZZLE coordinates, one near each leadscrew.
# With a 2,42 probe offset these put the probe at 22,42 / 22,272 / 272,150.
# CHECK: move to each point first and confirm the probe is over the bed.
points:
    20, 0
    20, 230
    270, 108
speed: 150
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075

[bed_mesh]
speed: 150
horizontal_move_z: 5
# PROBE coordinates (not nozzle). Kit RRF: M557 X10:280 Y50:280.
# CHECK: the probe must be able to reach these with your offsets.
mesh_min: 12, 42
mesh_max: 280, 280
probe_count: 7, 7
algorithm: bicubic
fade_start: 1
fade_end: 10
# For adaptive meshing (probe only where the print is), enable
# [exclude_object] below, turn on "label objects" in your slicer, and
# use BED_MESH_CALIBRATE ADAPTIVE=1 in PRINT_START (macros.cfg does).
adaptive_margin: 5

[exclude_object]

[gcode_arcs]
resolution: 0.1

#####################################################################
#   Input shaping
#####################################################################

# Measure with an ADXL345. The section below is for one wired to the
# Raspberry Pi's SPI pins (Klipper "Measuring Resonances" guide).
# A USB accelerometer board needs its own [mcu] section instead.
#[mcu rpi]
#serial: /tmp/klipper_host_mcu
#
#[adxl345]
#cs_pin: rpi:None
#
#[resonance_tester]
#accel_chip: adxl345
#probe_points:
#    150, 150, 20

# CHECK: run SHAPER_CALIBRATE, then SAVE_CONFIG. Do not copy another
# machine's numbers.
#[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 50
#shaper_type_y: mzv
#shaper_freq_y: 50

[idle_timeout]
timeout: 1800
