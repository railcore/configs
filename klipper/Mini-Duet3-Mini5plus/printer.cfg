# Klipper config: RailCore Mini, kit electronics
# (Duet 3 Mini 5+ with the Duet 3 Expansion Mini 2+, wired per the RailCore Mini guide)
#
# A STARTING POINT, NOT A DROP-IN FILE. Less field-tested than the 300ZL file.
# Read every section before you power up. Every value marked "CHECK:" must be
# verified on YOUR machine.
# Guide: https://railcore.org/klipper/railcore_config.html
#
# Sources for the values below:
#   - the kit RRF config: config/Duet3 Mini 5+/config.g in railcore/railcore-mini
#   - the RailCore Mini build guide (railcore.org/guides/), sections J, M, Q
#   - Klipper's config/generic-duet3-mini.cfg (pin numbers)
#
# Firmware: build Klipper for the SAME54P20 with a 25 MHz crystal, the 16 KiB
# bootloader and USB communication ("make menuconfig"). Double-tap the board's
# reset button to enter the bootloader, then: make flash FLASH_DEVICE=/dev/ttyACM0
# The WiFi/Ethernet module is not used: Klipper talks to the host over USB.
#
# Kit wiring (from the Mini guide, section Q, and the kit config.g):
#   - drive 0 extruder, drive 2 Z front right, drive 3 Z rear right, drive 4 Z left
#   - drives 5 and 6 are on the Expansion Mini 2+. The kit config.g maps X to
#     drive 6 and Y to drive 5 (M584 X6 Y5).
#     CHECK: the guide's wiring step labels drive 5 "X stepper (front)" and
#     drive 6 "Y stepper (rear)". Trust your motion test, not either label.
#   - X endstop io2 at X max (rear right), Y endstop io4 at Y min
#   - BLTouch on io3, bed thermistor temp0, hotend thermistor temp1
#   - bed heater out0, hotend heater out1, layer fan out4, panel fans out5,
#     hotend fan out6
#
# License: MIT (see LICENSE in the root of this repo).

[include macros.cfg]
#[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_same54p20a_CHANGE_ME-if00   # CHECK: ls /dev/serial/by-id/*

[printer]
kinematics: corexy
# Kit RRF values: M203 X12000 Y12000 Z900 (mm/min), M201 X2000 Y2000 Z150.
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 150
square_corner_velocity: 5.0

# The Duet 3 Mini measures its thermistors against its reference voltage.
[adc_scaled vref_scaled]
vref_pin: PB5
vssa_pin: PB4

#####################################################################
#   X/Y (CoreXY), both motors on the Expansion Mini 2+
#####################################################################

# Drive 6 (kit config.g: X)
[stepper_x]
step_pin: PC18
dir_pin: PA27            # CHECK: direction (motion test)
enable_pin: !PC28
microsteps: 16
rotation_distance: 32    # 16T GT2 (kit M92 X200 at 16x with 0.9 degree motors)
full_steps_per_rotation: 400
endstop_pin: ^PD8        # io2.in. CHECK: pull-up and switch polarity (QUERY_ENDSTOPS)
position_min: 0
position_endstop: 150    # X homes to MAX on the Mini (kit M574 X2)
position_max: 150        # CHECK: kit M208 X150
homing_positive_dir: true
homing_speed: 40
second_homing_speed: 10
homing_retract_dist: 5

[tmc2209 stepper_x]
uart_pin: PA1
tx_pin: PA0
select_pins: !PD0        # drives 4-6: inverted mux select
uart_address: 2          # Klipper mux address "!2" = drive 6 (inverted select)
interpolate: True
run_current: 1.0         # CHECK: from your motor rating (kit RRF M906 X1400 mA). RMS amps.
sense_resistor: 0.056

# Drive 5 (kit config.g: Y)
[stepper_y]
step_pin: PC30
dir_pin: !PB0            # CHECK: direction (motion test)
enable_pin: !PC28
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 400
endstop_pin: ^PC5        # io4.in. CHECK: pull-up and switch polarity
position_endstop: 0      # Y homes to MIN (kit M574 Y1)
position_min: 0
position_max: 150        # CHECK: kit M208 Y150
homing_speed: 40
second_homing_speed: 10
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: PA1
tx_pin: PA0
select_pins: !PD0        # drives 4-6: inverted mux select
uart_address: 1          # Klipper mux address "!1" = drive 5
interpolate: True
run_current: 1.0         # CHECK
sense_resistor: 0.056

#####################################################################
#   Z: three leadscrews. Order = kit M584 Z4:3:2 and M671.
#####################################################################

# Drive 4: LEFT
[stepper_z]
step_pin: PC16
dir_pin: PD21            # CHECK: all three Z motors must move the bed the same way
enable_pin: !PC28
microsteps: 16
rotation_distance: 4     # CHECK: TR8x4 with 0.9 degree motors (kit M92 Z1600 at 16x)
full_steps_per_rotation: 400
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 150        # CHECK: kit M208 Z150
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PA1
tx_pin: PA0
select_pins: !PD0        # drives 4-6: inverted mux select
uart_address: 0          # Klipper mux address "!0" = drive 4
interpolate: True
run_current: 0.9         # CHECK: kit RRF M906 Z1200 (mA)
sense_resistor: 0.056

# Drive 3: REAR RIGHT
[stepper_z1]
step_pin: PC19
dir_pin: PD20            # CHECK
enable_pin: !PC28
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 400

[tmc2209 stepper_z1]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 3
interpolate: True
run_current: 0.9         # CHECK
sense_resistor: 0.056

# Drive 2: FRONT RIGHT
[stepper_z2]
step_pin: PC24
dir_pin: PB28            # CHECK
enable_pin: !PC28
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 400

[tmc2209 stepper_z2]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 2
interpolate: True
run_current: 0.9         # CHECK
sense_resistor: 0.056

#####################################################################
#   Extruder and hotend: kit Bondtech LGX Lite, E3D Revo Micro
#####################################################################

[extruder]
step_pin: PC26           # drive 0
dir_pin: PB3             # CHECK: heat the hotend, extrude 10 mm, watch the direction
enable_pin: !PC28
microsteps: 16
# CHECK: kit M92 E562 at 16x with a 1.8 degree motor = 3200 / 562 = 5.694.
# Calibrate: extrude 100 mm, measure, new = old * actual / requested.
rotation_distance: 5.694
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC10         # out1
# CHECK: the E3D Revo thermistor. The kit RRF config used the generic E3D
# coefficients (B4725 C7.06e-8); Klipper has the Revo part built in.
sensor_type: ATC Semitec 104NT-4-R025H42G
pullup_resistor: 2200    # Duet 3 Mini thermistor inputs use 2.2 k pull-ups
sensor_pin: vref_scaled:PC1   # temp1
control: pid
pid_Kp: 22.2             # CHECK: placeholder until PID_CALIBRATE is run
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 285            # CHECK: kit M143 S285; stay within your hotend's rating
min_extrude_temp: 170
max_extrude_only_distance: 150
pressure_advance: 0.0    # CHECK: tune per filament

[tmc2209 extruder]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 0
interpolate: True
run_current: 0.5         # CHECK: kit RRF M906 E800 (mA); set from your LGX Lite motor rating
sense_resistor: 0.056

#####################################################################
#   Bed
#####################################################################

# Kit RRF bed thermistor: T100000 B4240
[thermistor mini_bed]
temperature1: 25
resistance1: 100000
beta: 4240               # CHECK: matches the kit config; confirm against your bed's thermistor

[heater_bed]
heater_pin: PB17         # out0
sensor_type: mini_bed
pullup_resistor: 2200
sensor_pin: vref_scaled:PC0   # temp0
control: pid
pid_Kp: 61.0             # CHECK: placeholder until PID_CALIBRATE is run
pid_Ki: 2.34
pid_Kd: 398
min_temp: 0
max_temp: 110            # CHECK: the kit config sets no bed limit; stay within your heater's rating

[temperature_sensor mcu]
sensor_type: temperature_mcu

[temperature_sensor host]
sensor_type: temperature_host

#####################################################################
#   Fans
#####################################################################

# Layer fan, out4
[fan]
pin: PA11
kick_start_time: 0.3
off_below: 0.10

# Hotend fan, out6 (kit: on above 50 C). Revo Micro: 5 V fan via the
# included buck converter.
[heater_fan hotend_fan]
pin: PB1
heater: extruder
heater_temp: 50
fan_speed: 1.0

# Panel fans, out5 (kit: always on)
[output_pin panel_fans]
pin: PB2
value: 1
shutdown_value: 1

#####################################################################
#   Probe: BLTouch on io3
#####################################################################

[bltouch]
sensor_pin: ^PB7         # io3.in. CHECK: pull-up (the kit RRF config has none)
control_pin: PB12        # io3.out
# CHECK: kit RRF G31 X2 Y42; depends on your mount.
x_offset: 2
y_offset: 42
#z_offset: run PROBE_CALIBRATE, then SAVE_CONFIG
speed: 5
samples: 2
samples_result: median
sample_retract_dist: 3
samples_tolerance: 0.02
samples_tolerance_retries: 3

[homing_heaters]
steppers: stepper_z
heaters: extruder

[safe_z_home]
home_xy_position: 73,33  # kit homez.g: nozzle 73,33 puts the probe at the bed centre
speed: 100
z_hop: 5
z_hop_speed: 5

#####################################################################
#   Bed leveling
#####################################################################

[z_tilt]
# Kit RRF M671 X-5:165:165 Y90:155:22.5 (left, rear right, front right),
# same order as stepper_z, stepper_z1, stepper_z2.
# CHECK: measure to each leadscrew on your machine.
z_positions:
    -5, 90
    165, 155
    165, 22.5
# NOZZLE coordinates. With a 2,42 probe offset the probe lands at
# 12,90 / 140,140 / 140,45.
# CHECK: confirm each one with PROBE_LEADSCREWS.
points:
    10, 48
    138, 98
    138, 3
speed: 100
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075

[bed_mesh]
speed: 100
horizontal_move_z: 5
# PROBE coordinates. CHECK: reachable with your probe offset.
mesh_min: 12, 45
mesh_max: 140, 140
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10
adaptive_margin: 5

[exclude_object]

[gcode_arcs]
resolution: 0.1

#####################################################################
#   Input shaping (see the 300ZL file for the ADXL345 sections)
#####################################################################

#[input_shaper]
# CHECK: run SHAPER_CALIBRATE, then SAVE_CONFIG.

[idle_timeout]
timeout: 1800
